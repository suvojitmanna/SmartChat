<svg width="360" height="90" viewBox="0 0 360 90" xmlns="http://www.w3.org/2000/svg" fill="none">

  <defs>
    <!-- Bubble Gradient -->
    <linearGradient id="bubbleGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"></stop>
      <stop offset="100%" stop-color="#8B5CF6"></stop>
    </linearGradient>

    <!-- Star Gradient -->
    <linearGradient id="starGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FACC15"></stop>
      <stop offset="100%" stop-color="#F97316"></stop>
    </linearGradient>
  </defs>

  <!-- Icon Group -->
  <g transform="translate(10,20)">
    <rect x="0" y="0" rx="18" ry="18" width="54" height="40" fill="url(#bubbleGradient)" opacity="0.15"></rect>
    
    <path d="M14 10h26a8 8 0 0 1 8 8v6a8 8 0 0 1-8 8H28l-10 8v-8h-4a8 8 0 0 1-8-8v-6a8 8 0 0 1 8-8z" fill="url(#bubbleGradient)"></path>

