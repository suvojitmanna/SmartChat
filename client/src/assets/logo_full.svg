    <path d="M27 4 L29.8 10.5 L36.5 13 L29.8 15.5 L27 22 L24.2 15.5 L17.5 13 L24.2 10.5 Z" fill="url(#starGradient)"></path>
  </g>

  <!-- Brand Name -->
  <text x="80" y="48" font-family="Outfit, Poppins, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">
    SmartChat
  </text>

  <!-- Tagline -->
  <text x="82" y="70" font-family="Outfit, Poppins, sans-serif" font-size="15" font-weight="500" fill="#A78BFA">
    Intelligent AI Chatbot
  </text>

</svg>
